<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>April 2025</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            /*font-size: 60px;*/
            font-size: 36px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        img {
            width: 45px;
        }
        tr {
            vertical-align: baseline;
            height: 124px;
        }
        tr:first-of-type {
            height: 44px;
        }
        td > div {
            font-size: 60px;
        }
        .today {
            background-color: #9c9cff;
        }
    </style>
  </head>
  <body>
    <table>
      <caption>April 2025</caption>
      <tr>
        <th>Sun</th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Wed</th>
        <th>Thu</th>
        <th>Fri</th>
        <th>Sat</th>
      </tr>
      <tr>
        <td>30</td>
        <td>31</td>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td>4</td>
        <td>5</td>
      </tr>
      <tr>
        <td>6</td>
        <td>7</td>
        <td>8</td>
        <td>9</td>
        <td>10</td>
        <td>11</td>
        <td>12</td>
      </tr>
      <tr>
        <td>13</td>
        <td>14</td>
        <td>15</td>
        <td>16</td>
        <td>17</td>
        <td>18</td>
        <td>19</td>
      </tr>
      <tr>
        <td>20</td>
        <td>21</td>
        <td>22</td>
        <td>23<div>🏃</div></td>
        <td>24</td>
        <td>25</td>
        <td>26</td>
      </tr>
      <tr>
        <td>27<div>🏋</div></td>
        <td>28</td>
        <td>29</td>
        <td class="today">30</td>
        <td>31</td>
        <td>1</td>
        <td>2</td>
      </tr>
    </table>
  </body>
</html>
